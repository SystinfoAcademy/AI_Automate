<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Du message au suivi : accompagnement semaine 2</title>
<style>
:root{--navy:#04243B;--blue:#0C78C0;--cyan:#2BA9E0;--gold:#E8A33D;--light:#EEF3F7;--gray:#5B6B78;--ink:#1F2A33;--mint:#E3F4EC;--peach:#FBEAE3;--pale:#BFD8E8;--green:#2E9E6B;--red:#D9534F;--line:#D5DEE5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#021827;overflow:hidden;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;background:#fff;overflow:hidden;display:none}
.slide.active{display:block}
.slide.dark{background:var(--navy);color:#fff}
.hdr{position:absolute;left:56px;right:56px;top:24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:3px solid var(--gold);padding-bottom:8px}
.hdr h1{font:700 32px/1.12 Georgia,"Times New Roman",serif;color:var(--navy);margin:0}
.logo{height:52px;display:block}
.body{position:absolute;left:56px;right:56px;top:108px;bottom:56px;display:flex;flex-direction:column;gap:14px}
.body.m{bottom:100px}
.ftr{position:absolute;left:56px;right:56px;bottom:16px;height:22px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--gray);letter-spacing:.22em}
.dark .ftr{color:var(--pale)}
.map{position:absolute;left:56px;right:56px;bottom:42px;height:40px;display:flex;align-items:center;gap:6px;font-size:14px}
.map .ml{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--gray);margin-right:8px}
.map .mn{padding:5px 13px;border-radius:15px;border:2px dashed #B9CBD8;color:#8aa0b0;font-weight:700;white-space:nowrap}
.map .mn.d{border:2px solid var(--green);background:#dff3e9;color:#1b6c47}
.map .mn.c{border:2px solid var(--gold);background:#FBE7C2;color:#7a4b00}
.map .ma{color:#B9CBD8;font-weight:700}
p{margin:0 0 10px;font-size:22px;line-height:1.38}
.sm{font-size:19px;line-height:1.38}.xs{font-size:16px;line-height:1.35}.muted{color:var(--gray)}
.k{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
.card.dark .k{color:var(--gold)}
.h2{font:700 27px/1.15 Georgia,serif;color:var(--navy);margin:0 0 8px}
.h3{font:700 21px/1.15 Georgia,serif;color:var(--navy);margin:0 0 6px}
.card.dark .h2,.card.dark .h3{color:#fff}
code{font-family:Consolas,"Courier New",monospace;background:#e3ebf1;border-radius:4px;padding:1px 6px;font-size:.88em;color:var(--navy)}
.card.dark code{background:rgba(255,255,255,.14);color:#fff}
b{font-weight:700}
.gold{color:var(--gold)}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g32{grid-template-columns:3fr 2fr}
.gt{grid-template-columns:1.12fr 1fr}
.main{flex:1;min-height:0}
.vc{display:flex;flex-direction:column;justify-content:center}
.card{background:var(--light);border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(4,36,59,.14);position:relative}
.card.dark{background:var(--navy);color:#fff}
.card.mint{background:var(--mint);box-shadow:none}.card.peach{background:var(--peach);box-shadow:none}
.card.white{background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(4,36,59,.08)}
.card.gold{background:#FBE7C2;box-shadow:none}
.callout{background:var(--mint);border-radius:8px;padding:11px 18px;font-weight:700;color:var(--navy);font-size:19px}
.callout.warn{background:var(--peach)}
.num{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font:700 21px Georgia,serif;flex:none}
.num.g{background:var(--gold);color:var(--navy)}
.big{font:700 54px/1 Georgia,serif;color:var(--gold)}
.ic{width:1em;height:1em}
ol.st{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:11px}
ol.st li{counter-increment:s;display:flex;gap:13px;align-items:flex-start;font-size:20.5px;line-height:1.3}
ol.st li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font:700 17px Georgia,serif;display:flex;align-items:center;justify-content:center;margin-top:0}
ul.cl{margin:0;padding-left:22px;font-size:20px;line-height:1.38}
ul.cl li{margin-bottom:7px}
table.t{border-collapse:collapse;width:100%;font-size:19px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:9px 14px;font-size:15px;letter-spacing:.05em}
table.t td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.3}
table.t tr:nth-child(even) td{background:#f6f9fb}
.cb{position:relative;background:#04243B;color:#E6F1F8;border-radius:8px;padding:11px 92px 11px 16px;margin:0}
.cb .cl{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.cb pre{margin:0;font:15.5px/1.4 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-word}
.cbs .cb{flex:1}.cbs .cb pre{font-size:13px;line-height:1.3}
.cpy{position:absolute;right:10px;top:10px;background:var(--gold);color:var(--navy);border:0;border-radius:6px;font:700 13px Calibri,Arial,sans-serif;padding:6px 12px;cursor:pointer}
.cpy.ok{background:var(--green);color:#fff}
/* canvas n8n */
.cv{display:flex;align-items:flex-start;justify-content:center}
.cnode{width:138px;text-align:center;position:relative}
.cnode .sq{width:94px;height:94px;margin:0 auto 9px;border-radius:18px;background:#fff;border:3px solid #cdd9e2;display:flex;align-items:center;justify-content:center;color:var(--blue);box-shadow:0 2px 6px rgba(4,36,59,.12);font-size:44px}
.cnode.act .sq{border-color:var(--gold);background:#FFF6E3;color:#b9740a;box-shadow:0 0 0 7px rgba(232,163,61,.28)}
.cnode.done .sq{border-color:var(--green);color:var(--green)}
.cnode b{display:block;font-size:19px;color:var(--navy)}
.cnode span{font-size:14px;color:var(--gray)}
.dk .cnode b{color:#fff}.dk .cnode span{color:var(--pale)}
.cline{flex:none;width:40px;height:4px;background:#9fb4c4;margin-top:45px;position:relative}
.cline::after{content:'';position:absolute;right:-3px;top:-7px;border-left:12px solid #9fb4c4;border-top:9px solid transparent;border-bottom:9px solid transparent}
.subn{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:130px;font-size:12px;color:var(--gray)}
.subn i{display:block;width:3px;height:22px;margin:0 auto;border-left:3px dotted #9fb4c4}
.subn div{border:2px solid #cdd9e2;border-radius:20px;padding:4px 8px;background:#fff;color:var(--navy);font-weight:700}
/* telegram mock */
.tg{border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(4,36,59,.25);display:flex;flex-direction:column;height:100%;background:#cfdde8}
.tgh{background:#517da2;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.tgh .av{width:38px;height:38px;border-radius:50%;background:#2BA9E0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.tgh b{font-size:17px}.tgh .s{font-size:12px;opacity:.85}
.tgb{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px;overflow:hidden;justify-content:flex-end}
.bb{max-width:84%;padding:8px 12px;border-radius:12px;font-size:15.5px;line-height:1.3;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bb.me{align-self:flex-end;background:#effdde;border-bottom-right-radius:3px}
.bb.bot{align-self:flex-start;background:#fff;border-bottom-left-radius:3px}
.bb em{display:block;font-style:normal;font-size:12px;color:#2a8ac4;font-weight:700;margin-bottom:2px}
.tgi{background:#fff;color:#99a;padding:9px 16px;font-size:15px;border-top:1px solid #dde}
/* notion mock */
.nt{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(4,36,59,.12);overflow:hidden;height:100%;display:flex;flex-direction:column}
.nth{padding:14px 18px 8px;font:700 24px Georgia,serif;color:#37352f}
.nts{padding:0 18px 8px;font-size:13px;color:#9b9a97}
.nt table{border-collapse:collapse;width:100%;font-size:15px;color:#37352f}
.nt th{font-weight:600;text-align:left;padding:7px 10px;border-top:1px solid #e9e9e7;border-bottom:1px solid #e9e9e7;border-right:1px solid #e9e9e7;color:#787774;font-size:13px;white-space:nowrap}
.nt td{padding:8px 10px;border-bottom:1px solid #e9e9e7;border-right:1px solid #e9e9e7;white-space:nowrap}
.nt th.hl{background:#FBE7C2;color:#7a4b00}
.nt .tag{background:#e3e2e0;border-radius:4px;padding:1px 7px;font-size:13px}
.nt .tag.o{background:#fdecc8}.nt .tag.r{background:#ffe2dd}.nt .tag.g{background:#dbeddb}
.nt .sb{display:flex;flex:1}
.nt .side{width:130px;background:#f7f6f3;padding:12px;font-size:13px;color:#787774;border-right:1px solid #e9e9e7}
.nt .side div{padding:3px 0}.nt .side .on{background:#e8e7e4;border-radius:4px;padding:3px 6px;color:#37352f}
.nt .pg{flex:1}
/* n8n panel mock */
.pn{background:#fff;border:1px solid #d9dde2;border-radius:12px;box-shadow:0 2px 8px rgba(4,36,59,.12);overflow:hidden}
.pnh{background:#f3f4f6;padding:10px 16px;font-weight:700;color:#1f2a33;font-size:16px;border-bottom:1px solid #d9dde2;display:flex;justify-content:space-between}
.pnh span{color:#ff6d5a;font-size:13px}
.pr{padding:8px 16px 4px}
.pl{font-size:12.5px;color:#6b7280;font-weight:700;margin-bottom:3px}
.pv{border:1px solid #cbd1d8;border-radius:6px;padding:6px 10px;font-size:15px;background:#fff;color:#1f2a33;line-height:1.3}
.pv.x{background:#fff4ee;border-color:#ffb89f;font-family:Consolas,monospace;font-size:13.5px;color:#a13c10}
.pv.d{background:#f3f4f6;color:#6b7280}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#ffe9e3;color:#a13c10;border-radius:5px;padding:2px 8px;font-size:12.5px;font-weight:700}
.out{background:#f8fafc;border-top:1px solid #d9dde2;padding:10px 16px;font:14px/1.5 Consolas,monospace;color:#1f2a33}
.out b{color:#2E9E6B;font-family:Calibri,sans-serif;font-size:12px;letter-spacing:.12em;display:block}
.ladder{display:flex;flex-direction:column;gap:7px;height:100%;justify-content:center}
.ladder div{border-radius:10px;padding:10px 16px;font-size:19px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.ladder .l1{background:#e3f4ec}.ladder .l2{background:#d4ecf7}.ladder .l3{background:#FBE7C2}.ladder .l4{background:#fbd6cc}
.ladder b{font-family:Georgia,serif;white-space:nowrap}
.sec{position:absolute;left:84px;right:84px;top:130px}
.sec .sn{font:700 110px/1 Georgia,serif;color:var(--gold)}
.sec .st{font:700 50px/1.1 Georgia,serif;margin:12px 0 12px}
.sec .ss{font-size:25px;color:var(--pale);max-width:900px}
.sec .sm4{position:absolute;right:0;top:0;font-size:15px;letter-spacing:.25em;color:var(--gold);font-weight:700}
.timer{font:700 90px/1 Consolas,monospace;color:#fff;text-align:center;margin:10px 0}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:9px 20px;font:700 17px Calibri,Arial,sans-serif;cursor:pointer;margin:0 5px}
.btn.g{background:transparent;color:#fff;border:2px solid var(--pale)}
.chk{width:28px;height:28px;border:2px solid var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.ck{cursor:pointer;display:flex;gap:14px;align-items:center;padding:11px 18px}
.ck.on{background:var(--mint)}.ck.on .chk{background:var(--green);border-color:var(--green)}
.who{display:flex;gap:14px;align-items:center}
.who .ico{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.ico.b{background:#d4ecf7;color:var(--blue)}.ico.g{background:#FBE7C2;color:#b9740a}
#bar{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.12);z-index:20}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#04243B;color:#fff;padding:14px 28px;font-size:17px;line-height:1.45;border-top:3px solid var(--gold);display:none;z-index:25}
#notes.show{display:block}
#notes b{color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(2,24,39,.94);z-index:30;display:none;overflow:auto;padding:36px 60px;color:#fff}
.ov.show{display:block}
.ov h2{font:700 30px Georgia,serif;margin:0 0 18px;color:var(--gold)}
.ov .grp{margin-bottom:16px}.ov .gt2{font-size:13px;letter-spacing:.2em;color:var(--pale);margin-bottom:6px;font-weight:700}
.ov .it{display:inline-block;background:#0b3a5a;border-radius:6px;padding:6px 12px;margin:0 6px 6px 0;font-size:15px;cursor:pointer}
.ov .it.cur{background:var(--gold);color:var(--navy);font-weight:700}
.ov .it b{color:var(--gold);margin-right:6px}.ov .it.cur b{color:var(--navy)}
.help{position:fixed;right:12px;bottom:8px;font-size:12px;color:#6f8fa6;z-index:15}
</style>
</head>

function section(sec,n,title,sub,mins,notes,act){S({sec,dark:true,raw:true,title,notes,html:`<div class="sec"><div class="sm4">${mins}</div><div class="sn">${n}</div><div class="st">${title}</div><div class="ss">${sub}</div></div><div style="position:absolute;left:84px;right:84px;bottom:110px">${canvas(act,true,true)}</div>`})}

html:`<div class="grid main" style="grid-template-columns:1.55fr 1fr"><div class="cbs" style="display:flex;min-height:0">${cb(`# Contexte : la structure (entreprise fictive)

## Identité
Structure de 30 personnes. Monnaie : franc CFA (F CFA).

## Rôles
Demandeur : toute personne qui a un besoin d'achat.
Responsable administrative : contrôle les demandes.
Direction : valide les achats de 2 000 000 F CFA HT et plus.

## Règles d'achat

- Trois devis dès 500 000 F CFA HT.

Français, phrases courtes. Montants avec une espace : 1 250 000 F CFA HT.

S({sec:'d',map:0,title:'Claude · 2 Les instructions : le texte à déposer',
html:`<div class="grid main" style="grid-template-columns:1.55fr 1fr"><div class="cbs" style="display:flex;min-height:0">${cb(`## Rôle
Tu es l'assistant de la responsable administrative d'une structure de 30 personnes.

## Mission
Contrôler les demandes d'achat de la base Notion « Carnet » et préparer des brouillons.

## Sources à consulter en priorité
1. Le contexte du projet.
2. La base Notion « Carnet », jamais tes connaissances générales, pour tout chiffre.

## Règles
- Applique les seuils sans arrondir ni interpréter.
- Cite la source de chaque chiffre et de chaque règle.
- Si une information manque, dis-le et demande-la. N'invente rien.
- Parle de « signalement à vérifier », jamais de fraude.
- Rien n'est envoyé sans validation : brouillons seulement.

## Format
Français simple. Commence par l'essentiel en trois lignes, puis le détail.

## Vérification avant de répondre
Recalcule les totaux depuis la base. Chaque point d'attention se termine par une action, un responsable et une échéance.`,'Instructions du projet')}</div><div style="display:flex;flex-direction:column;gap:10px;justify-content:center"><div class="card white"><div class="k">Configuration</div>${ol(['Dans le projet <code>Guichet</code>, ouvrez le champ <b>Instructions</b>','Collez ce texte','Enregistrez'])}</div><div class="card mint"><div class="k" style="color:#1b6c47">Résultat attendu</div><p class="xs" style="margin:0 0 6px">Posez : <code>Rappelle-moi ta mission et tes règles.</code></p><p class="xs" style="margin:0">Claude répond en trois lignes, dit qu’il cite ses sources, qu’il ne devine pas et qu’il parle de « signalement à vérifier ».</p></div></div></div>`});

/* ================= MOTEUR ================= */
const stage=$('#stage');let cur=0;
function chrome(s){
  const foot=`<div class="ftr"><span>SYSTINFO ACADEMY</span><span>${secOf(s.sec).name} · ${s.i+1}/${SL.length}</span></div>`;
  if(s.raw){const lg=s.nologo?'':`<div style="position:absolute;right:56px;top:28px;background:#fff;border-radius:6px;padding:4px 8px"><img class="logo" style="height:48px" src="${LOGO}" alt="SYSTINFO"></div>`;return s.html+lg+(s.noftr?'':foot)}
  const hasMap=s.map!==undefined&&s.map!==null&&s.map>0;
  return `<div class="hdr"><h1>${s.title}</h1><img class="logo" src="${LOGO}" alt="SYSTINFO"></div><div class="body${hasMap?' m':''}">${s.html}</div>${hasMap?mapBar(s.map,s.ph,s.noA):''}${foot}`}
SL.forEach(s=>{const d=document.createElement('div');d.className='slide'+(s.dark?' dark':'');d.innerHTML=chrome(s);stage.appendChild(d);s.el=d;
  if(s.timer){const r=$('[data-t]',d);const m=s.timer[0];r.innerHTML=timerHtml(m);let left=m*60,iv=null;const dd=$('[data-d]',r),sb=$('[data-s]',r);
    const draw=()=>{dd.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');dd.style.color=left===0?'#ff8a80':'#fff'};
    sb.onclick=()=>{if(iv){clearInterval(iv);iv=null;sb.textContent='Reprendre'}else{sb.textContent='Pause';iv=setInterval(()=>{if(left>0){left--;draw()}else{clearInterval(iv);iv=null;sb.textContent='Terminé'}},1000)}};
    $('[data-r]',r).onclick=()=>{clearInterval(iv);iv=null;left=m*60;sb.textContent='Démarrer';draw()}}
  $$('[data-c]',d).forEach(c=>c.onclick=()=>{const on=c.classList.toggle('on');const k=$('.chk',c);if(k)k.textContent=on?'✓':''});
});
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${k})`;stage.style.left=Math.max(0,(innerWidth-1280*k)/2)+'px';stage.style.top=Math.max(0,(innerHeight-720*k)/2)+'px'}
function show(i,fromHash){i=Math.max(0,Math.min(SL.length-1,i));$$('.slide.active').forEach(e=>e.classList.remove('active'));SL[i].el.classList.add('active');cur=i;
  $('#bar i').style.width=((i+1)/SL.length*100)+'%';
  if(!fromHash){try{history.replaceState(null,'','#'+(i+1))}catch(e){}}}
const next=()=>show(cur+1),prev=()=>show(cur-1);
function renderPlan(){let h='<h2>Plan de la séance</h2>';SECS.forEach(sc=>{const it=SL.filter(s=>s.sec===sc.id);if(!it.length)return;h+=`<div class="grp"><div class="gt2">${sc.name.toUpperCase()}</div>${it.map(s=>`<span class="it ${s.i===cur?'cur':''}" data-go="${s.i}"><b>${s.i+1}</b>${(s.title||'').replace(/<[^>]+>/g,'')}</span>`).join('')}</div>`});$('#ov-plan').innerHTML=h}
const toggle=id=>{const o=$('#ov-'+id);if(id==='plan'&&!o.classList.contains('show'))renderPlan();o.classList.toggle('show')};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='Home')show(0);else if(k==='End')show(SL.length-1);
  else if(k==='f'||k==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
  else if(k==='o'||k==='O')toggle('plan');
  else if(k==='Escape'){$('#ov-plan').classList.remove('show');$('#notes').classList.remove('show')}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cp]');if(b){const t=COPIES[+b.dataset.cp];const done=()=>{b.textContent='Copié ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='Copier';b.classList.remove('ok')},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>{fallback(t);done()})}else{fallback(t);done()}return}
  const g=e.target.closest('[data-go]');if(g){$('#ov-plan').classList.remove('show');show(+g.dataset.go)}
});
function fallback(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
addEventListener('resize',fit);addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==cur)show(n-1,true)});
fit();show((parseInt(location.hash.slice(1))||1)-1,true);
</script>
